<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <script src="./theme-init.js"></script>
    <link rel="stylesheet" href="./library/library.css" />
    <title>文献工作台 · 我的文献库</title>
    <link rel="stylesheet" href="./harness.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="./" aria-label="文献工作台首页"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 4h6q3 0 3 2 0-2 3-2h6v16h-6q-3 0-3 1-1-1-3-1H3zM12 6v15"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          /></svg
        ><strong>文献工作台</strong></a
      >
      <div class="search-box">
        <select id="search-scope" aria-label="检索范围">
          <option value="metadata">文献信息</option>
          <option value="fulltext">PDF 正文</option>
          <option value="all">全部内容</option>
        </select>
        <span aria-hidden="true">⌕</span
        ><input
          id="search"
          type="search"
          placeholder="搜索题名、作者、期刊、DOI 或文件名…"
          aria-label="搜索文献"
        /><kbd>Ctrl K</kbd>
      </div>
      <div class="header-actions">
        <button id="new-item">＋ 新建条目</button>
        <div class="import-actions">
          <button class="primary" id="import-pdf">＋ 导入 PDF</button>
          <details class="import-menu">
            <summary aria-label="更多导入方式" title="更多导入方式">
              <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </summary>
            <button type="button" id="import-folder">导入文件夹中的 PDF</button>
          </details>
        </div>
      </div>
    </header>
    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <div class="library-label">
          <span class="local-dot"></span
          ><strong id="library-label">我的文献库</strong>
        </div>
        <nav class="views" aria-label="文献库视图">
          <button data-view="all" class="active">
            <span>▤</span>全部文献<b id="count-all">0</b></button
          ><button data-view="needs">
            <span>◌</span>待补全<b id="count-needs">0</b></button
          ><button data-view="unread">
            <span>○</span>未读文献<b id="count-unread">0</b></button
          ><button data-view="favorites">
            <span>☆</span>收藏文献<b id="count-favorites">0</b>
          </button>
        </nav>
        <div class="sidebar-section">
          <h2>智能集合</h2>
          <div id="saved-list"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-label">
            <h2>组合筛选</h2>
            <span>不同维度同时满足</span>
          </div>
          <div id="facets"></div>
        </div>
        <div class="sidebar-bottom">
          <a class="sidebar-tool" href="./tools.html#index" target="_blank"
            >全文索引与 OCR ↗</a
          >
          <a class="sidebar-tool" href="./tools.html#citations" target="_blank"
            >Word / WPS 引用 ↗</a
          >
          <button class="sidebar-tool" id="journal-aliases">期刊别名管理</button
          ><button class="sidebar-tool trash-link" data-view="trash">
            回收站 <span id="count-trash">0</span>
          </button>
          <p><span class="local-dot"></span>本地保存 · 无需账号</p>
        </div>
      </aside>
      <main class="library-main">
        <div class="library-toolbar">
          <div>
            <div class="eyebrow">LIBRARY</div>
            <h1 id="view-title">全部文献</h1>
            <span class="result-number"><b id="result-total">0</b> 篇文献</span>
          </div>
          <div class="toolbar-actions">
            <button id="mobile-filters" class="mobile-only">筛选</button
            ><button id="update-query" hidden>更新集合条件</button
            ><button id="save-query">保存为智能集合</button>
          </div>
        </div>
        <div class="filter-summary">
          <div id="query-chips"></div>
          <button class="text-button" id="clear-filters" hidden>清空</button>
        </div>
        <div id="result-error" class="result-error" role="alert" hidden></div>
        <div class="list-controls">
          <span id="result-caption">正在打开文献库…</span
          ><label
            >排序
            <select id="sort">
              <option value="added:desc">最近添加</option>
              <option value="updated:desc">最近修改</option>
              <option value="year:desc">年份从新到旧</option>
              <option value="year:asc">年份从旧到新</option>
              <option value="title:asc">题名</option>
            </select></label
          >
        </div>
        <div class="selection-bar" id="selection-bar" hidden>
          <span>已选 <b id="selected-count">0</b> 条</span
          ><button id="batch-edit">批量整理</button
          ><button id="export-selected">导出文献数据</button
          ><button id="cite-selected">插入写作引用</button
          ><button id="trash-selected">移入回收站</button
          ><button class="text-button" id="clear-selection">取消选择</button>
        </div>
        <div class="table-scroll">
          <table class="papers-table">
            <thead>
              <tr>
                <th class="check-cell">
                  <input
                    type="checkbox"
                    id="select-all"
                    aria-label="选择本页全部文献"
                  />
                </th>
                <th>题名与作者</th>
                <th class="year-cell">年份</th>
                <th class="journal-cell">期刊 / 会议</th>
                <th>阅读状态</th>
                <th>附件</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
          <div class="empty-state" id="empty-state" hidden>
            <span>⌕</span>
            <h2>没有找到符合条件的文献</h2>
            <p>试着减少筛选条件，或清空搜索词。也可以导入新的 PDF。</p>
          </div>
        </div>
        <div class="list-footer">
          <span id="query-status" role="status">本地资料库</span>
          <div>
            <button id="previous-page" disabled>上一页</button
            ><button id="next-page" disabled>下一页</button
            ><span class="small muted">每页 100 条</span>
          </div>
        </div>
      </main>
      <aside
        class="details-panel"
        id="details"
        aria-label="文献详情与编辑"
      ></aside>
    </div>
    <input
      type="file"
      id="file-input"
      accept=".pdf,application/pdf"
      multiple
      hidden
    /><input type="file" id="folder-input" webkitdirectory multiple hidden />
    <div id="drop-cover" class="drop-cover" hidden>
      <div>
        <strong>松开以导入 PDF</strong>
        <p>原文件保留，相同文件不会重复导入。</p>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./library/app.js"></script>
  </body>
</html>
